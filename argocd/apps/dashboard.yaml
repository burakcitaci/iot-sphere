apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/burakcitaci/iot-sphere.git
    targetRevision: feature/helm-chart
    path: helm/charts/iot-sphere
    helm:
      values: |
        replicaCount: 1
        image:
          repository: iot-sphere-dashboard
          tag: latest
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 3000
        ingress:
          enabled: false
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        # OpenTelemetry Collector configuration
        otelcol:
          enabled: true
          image:
            repository: otel/opentelemetry-collector
            tag: "0.96.0"
            pullPolicy: IfNotPresent
          config:
            processors:
              resource:
                attributes:
                  - key: environment
                    value: "production"
                    action: upsert
            exporters:
              otlp:
                endpoint: "http://localhost:4317"
                tls:
                  insecure: true
          service:
            type: ClusterIP
            ports:
              - name: otlp-grpc
                port: 4317
                targetPort: 4317
              - name: otlp-http
                port: 4318
                targetPort: 4318
              - name: jaeger-grpc
                port: 14250
                targetPort: 14250
              - name: jaeger-http
                port: 14268
                targetPort: 14268
              - name: zipkin
                port: 9411
                targetPort: 9411
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 400Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
