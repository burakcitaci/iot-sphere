apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/burakcitaci/iot-sphere.git
    targetRevision: feature/helm-chart
    path: helm/charts/iot-sphere
    helm:
      values: |
        replicaCount: 1
        image:
          repository: iot-sphere-dashboard
          tag: latest
          pullPolicy: IfNotPresent
        service:
          type: ClusterIP
          port: 3000
        ingress:
          enabled: true
          className: nginx
          annotations:
            kubernetes.io/ingress.class: nginx
            # cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - host: localhost
              paths:
                - path: /
                  pathType: Prefix
          # tls:
          #   - secretName: dashboard-tls
          #     hosts:
          #       - localhost
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m 