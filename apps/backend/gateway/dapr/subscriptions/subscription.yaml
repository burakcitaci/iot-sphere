apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: pubsub
spec:
  topic: telemetry
  routes:
    default: /api/devices/telemetry
  pubsubname: pubsub
  deadLetterTopic: telemetry-dlq
  retryPolicy:
    maxRetries: 3
    maxRetryBackoff: 2s
scopes:
  - gateway-api
  - orderprocessing